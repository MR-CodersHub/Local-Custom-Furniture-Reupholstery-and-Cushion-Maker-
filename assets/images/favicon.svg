<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2920"/>
      <stop offset="60%" stop-color="#261A14"/>
      <stop offset="100%" stop-color="#19110D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D8A7"/>
      <stop offset="45%" stop-color="#BDA06D"/>
      <stop offset="100%" stop-color="#8F6D38"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C97358"/>
      <stop offset="100%" stop-color="#A14E36"/>
    </linearGradient>
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D98369"/>
      <stop offset="70%" stop-color="#B7654A"/>
      <stop offset="100%" stop-color="#99462E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.55"/>

  <!-- Main Chair Group with subtle shadow -->
  <g filter="url(#shadow)">
    <!-- Backrest Shell -->
    <path d="M21 16 C21 13.5, 43 13.5, 43 16 C44.5 22, 45 31, 43 36 L21 36 C19 31, 19.5 22, 21 16 Z" fill="url(#terracottaGrad)"/>
    
    <!-- Deep Button Tufting Details -->
    <path d="M25 21 L32 26 L39 21 M25 31 L32 26 L39 31 M32 17 L32 34" stroke="url(#goldGrad)" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.45"/>
    <circle cx="25" cy="21" r="1.3" fill="url(#goldGrad)"/>
    <circle cx="39" cy="21" r="1.3" fill="url(#goldGrad)"/>
    <circle cx="32" cy="26" r="1.4" fill="url(#goldGrad)"/>
    <circle cx="25" cy="31" r="1.3" fill="url(#goldGrad)"/>
    <circle cx="39" cy="31" r="1.3" fill="url(#goldGrad)"/>

    <!-- Left Rolled Armrest -->
    <path d="M14 26 C12 26, 11 28, 11 31.5 C11 36.5, 13 40.5, 17 41.5 C19.5 41.5, 20.5 39, 20.5 35.5 L20 28 C20 26.5, 17 26, 14 26 Z" fill="url(#goldGrad)"/>

    <!-- Right Rolled Armrest -->
    <path d="M50 26 C52 26, 53 28, 53 31.5 C53 36.5, 51 40.5, 47 41.5 C44.5 41.5, 43.5 39, 43.5 35.5 L44 28 C44 26.5, 47 26, 50 26 Z" fill="url(#goldGrad)"/>

    <!-- Plump Deep Cushion -->
    <path d="M16.5 34.5 C16.5 33, 47.5 33, 47.5 34.5 C48 38, 46.5 42, 44 43 C38 44.5, 26 44.5, 20 43 C17.5 42, 16 38, 16.5 34.5 Z" fill="url(#cushionGrad)"/>

    <!-- Wooden Seat Base Apron -->
    <path d="M19 42.5 L45 42.5 C44 44.5, 20 44.5, 19 42.5 Z" fill="#1C130E"/>

    <!-- Brass Turned Legs -->
    <path d="M19 44 L15 53" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M45 44 L49 53" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M25 44 L24 49.5" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M39 44 L40 49.5" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
