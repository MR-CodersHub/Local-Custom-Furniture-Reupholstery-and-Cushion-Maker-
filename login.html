<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Craftwork Atelier</title>
  <meta name="description" content="Sign in to your Craftwork Atelier account to track orders, request fabric samples and manage your upholstery projects.">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <meta name="theme-color" content="#4A3025">
<link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <main class="auth-standalone">
    <div class="auth-card">
      <div class="auth-brand">
        <a href="index.html" class="auth-brand-logo">
          <img src="assets/images/logo.png" alt="Craftwork Atelier Logo" class="auth-logo-img">
        </a>
        <a href="index.html" class="auth-brand-name">Craftwork Atelier</a>
        <div class="auth-brand-tag">Bespoke Upholstery &amp; Cushions</div>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-sub">Sign in to continue to your account.</p>

      <div class="auth-social">
        <a href="https://www.google.com" target="_blank" rel="noopener noreferrer" class="auth-social-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg> Continue with Google</a>
        <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" class="auth-social-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg> Continue with Facebook</a>
        <a href="https://www.apple.com" target="_blank" rel="noopener noreferrer" class="auth-social-btn"><svg width="18" height="18" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg> Continue with Apple</a>
      </div>

      <div class="auth-divider">or continue with email</div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" name="email" class="form-control" placeholder="you@example.com" autocomplete="email">
          <div class="form-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="pw-toggle" data-pw-toggle="login-password" aria-label="Show password"></button>
          </div>
          <div class="form-error"></div>
        </div>
        <div class="auth-row">
          <label class="checkbox-label"><input type="checkbox" id="login-remember"> Remember me</label>
          <button type="button" class="auth-link" id="forgot-password">Forgot password?</button>
        </div>
        <button type="submit" class="btn btn-primary btn-lg auth-submit">Sign In</button>
      </form>

      <p class="auth-switch">Don&rsquo;t have an account? <a href="register.html">Sign Up</a></p>
    </div>
  </main>

  <div class="toast-container"></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
